name: yingshi_tv
description: "影视 - Windows 桌面端本地播放器与信息聚合客户端（Flutter + JVM 解析层，不含任何内容源）"
publish_to: "none"
version: 1.2.1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Windows 桌面与窗口管理
  window_manager: ^0.3.9
  screen_retriever: ^0.1.9

  # 状态管理与响应式
  flutter_riverpod: ^2.5.1

  # 官方 Material 页面、弹窗与内容过渡
  animations: 3.0.0

  # 网络与数据持久化
  dio: ^5.4.3+1
  crypto: ^3.0.7
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # 应用信息（读取构建注入的版本资源，见 SET-06）
  package_info_plus: ^10.2.1

  # 媒体播放 (Windows 优先使用 MPV 方案)
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.8
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  xml: '>=6.3.0 <8.0.0'

  # 运行时组件（JRE 等）按需下载后解压：纯 Dart 的 zip 解析，
  # 不依赖系统 tar / 7-Zip（精简版 Windows 可能没有）。
  archive: ^4.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
